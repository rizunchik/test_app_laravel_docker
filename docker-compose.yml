services:
  nginx:
    image: nginx:latest
    volumes:
      - ./:/var/www
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d
    ports:
     - "8080:80"
    depends_on:
      - app
  app:
    build:
      context: .
      dockerfile: _docker/app/DockerFile
    volumes:
      - ./:/var/www
    depends_on:
      - db
  db:
    image: mysql:9.4
    restart: always
    volumes:
      - ./tmp/db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: test_app_laravel_docker
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3306:3306 
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
