services:
  nginx:
    image: nginx:latest
    volumes:
      - ./:/var/www
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d
    ports:
     - "8080:80"
    depends_on:
      - app
  app:
    build:
      context: .
      dockerfile: _docker/app/DockerFile
    volumes:
      - ./:/var/www
    environment:
      DB_CONNECTION: ${DB_CONNECTION:?Set DB_CONNECTION in .env}
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:?Set QUEUE_CONNECTION in .env}
    depends_on:
      - db
    command: sh -lc "_docker/app/start.sh"
  db:
    image: mysql:9.4
    restart: always
    volumes:
      - ./tmp/db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - 3306:3306 
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
  node:
    image: node:22
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports: 
      - 5173:5173
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
  queue:
    build:
      context: .
      dockerfile: _docker/app/DockerFile
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      DB_CONNECTION: ${DB_CONNECTION:?Set DB_CONNECTION in .env}
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:?Set QUEUE_CONNECTION in .env}
    depends_on:
      - db
      - app
    restart: unless-stopped
    # command: sh -lc "php artisan queue:work database --sleep=0 --tries=3 --max-time=3600"
    command: sh -lc "php artisan config:clear || true && php artisan migrate --force || true && php artisan queue:work database --sleep=0 --tries=3 --max-time=3600"